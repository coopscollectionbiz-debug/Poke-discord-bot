<!doctype html>
<!-- Renders a mockup in an exact phone viewport for screenshots: frame.html?src=teams-a.html&w=390&h=844 -->
<html><body style="margin:0;background:#0b0e18"><script>
const q = new URLSearchParams(location.search);
const f = document.createElement("iframe");

document.body.append(f);
