<!doctype html>
<!-- Design mockup (static, synthetic data). Not served by the bot.
     Overview (home): both teams at a glance, ranked + casual records, rewards waiting, Pokédex completion. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Overview (mockup)</title>
<link rel="stylesheet" href="../../../../public/shared/tokens.css" />
<link rel="stylesheet" href="../../../../public/shared/components.css" />
<link rel="stylesheet" href="mock.css" />
<style>
  .ov-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .ov-rank { grid-column: span 5; }
  .ov-casual { grid-column: span 3; }
  .ov-rewards { grid-column: span 4; }
  .ov-teams { grid-column: span 7; }
  .ov-dex { grid-column: span 5; }
  .ov-big { font-size: 46px; font-weight: 800; color: var(--cc-gold); line-height: 1; }
  .ov-kv { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-weight: 700; }
  .ov-kv span { color: var(--cc-text-muted); font-weight: 600; font-size: 13px; display: block; }
  .ov-kv b { font-size: 18px; }
  .ov-wl { height: 8px; border-radius: 4px; background: var(--cc-red); overflow: hidden; margin-top: 12px; }
  .ov-wl i { display: block; height: 100%; background: var(--cc-green); }
  .ov-link { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; text-decoration: none; }
  .ov-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin: 0; padding: 0; }
  .ov-strip li { list-style: none; position: relative; display: flex; flex-direction: column; align-items: center; padding: 6px 2px; border-radius: 10px; background: var(--cc-surface-raised); border: 1.5px solid var(--cc-line); font-size: 11.5px; font-weight: 800; }
  .ov-strip li.lead { border-color: #4f8cffaa; }
  .ov-strip li.shiny { border-color: #f5c84caa; }
  .ov-strip img { height: 52px; max-width: 100%; object-fit: contain; image-rendering: pixelated; }
  .ov-strip .m { position: absolute; top: 3px; right: 3px; }
  .ov-strip small { color: var(--cc-text-muted); font-weight: 700; }
  .ov-strip small.b { color: var(--cc-blue); }
  .ov-teamhead { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 15px; }
  .ov-teamhead .mk-ic { width: 18px; height: 18px; }
  .ov-teamhead a { margin-left: auto; font-size: 13px; display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; justify-content: flex-end; }
  .ov-reward { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; background: var(--cc-surface-raised); margin-bottom: 8px; }
  .ov-reward img { width: 32px; height: 32px; image-rendering: pixelated; }
  .ov-reward p { flex: 1; margin: 0; color: var(--cc-text); font-weight: 700; font-size: 14px; }
  .ov-reward p small { display: block; color: var(--cc-text-muted); font-weight: 600; }
  .ov-reward .cc-btn { padding: 0 14px; }
  .ov-reg { display: grid; grid-template-columns: 70px 1fr 64px; gap: 10px; align-items: center; margin: 8px 0; font-weight: 700; font-size: 13.5px; }
  .ov-reg .bar { height: 8px; border-radius: 4px; background: var(--cc-surface-sunken); overflow: hidden; }
  .ov-reg .bar i { display: block; height: 100%; background: var(--cc-green); }
  .ov-reg span:last-child { text-align: right; color: var(--cc-text-muted); }
  @media (max-width: 1100px) { .ov-rank, .ov-casual, .ov-rewards, .ov-teams, .ov-dex { grid-column: span 12; } .ov-casual { grid-column: span 6; } .ov-rewards { grid-column: span 6; } }
  @media (max-width: 820px) { .ov-casual, .ov-rewards { grid-column: span 12; } .ov-strip img { height: 40px; } .ov-strip { gap: 4px; } }
</style>
</head>
<body data-page="overview">
<header class="cc-page-head">
  <p class="cc-eyebrow">Overview</p>
  <h1>Welcome back, SyntheticAsh</h1>
  <p>Experienced Trainer · 1,800 TP to Ace Trainer</p>
</header>
<main id="ccMain" tabindex="-1"></main>
<script src="mock-data.js"></script>
<script src="mock-kit.js"></script>
<script>
const { icon, sprite, team, M, ROOT } = MK;
MK.shell("overview");
const strip = (key) => `<ul class="ov-strip">${team(key).map((p, i) => p ? `<li class="${i === 0 ? "lead" : ""}${p.variant === "shiny" ? " shiny" : ""}">
  ${p.mega ? '<span class="m mk-tag mk-tag--mega" style="font-size:9px;padding:0 5px">Mega</span>' : ""}
  <img src="${sprite(p.id, p.variant, p.mega?.id)}" alt="${p.mega ? p.mega.name : p.name}">
  <small class="${key === "battle" ? "b" : ""}">Lv ${key === "battle" ? 50 : p.level}</small></li>` : "<li></li>").join("")}</ul>`;
const kantoOwned = M.dex.filter((p) => p.normal + p.shiny > 0).length;
const regs = [["Kanto", kantoOwned], ...["Johto", "Hoenn", "Sinnoh", "Unova"].map((r) => [r, M.regionOwned[r]])];
document.getElementById("ccMain").innerHTML = `<div class="ov-grid">
  <section class="mk-panel mk-panel--battle ov-rank" aria-label="Ranked record">
    <h2 class="mk-h2">${icon("trophy")}Ranked</h2>
    <div style="display:flex;align-items:flex-end;gap:16px;margin-top:10px"><span class="ov-big">1,284</span><span style="font-weight:800;font-size:18px">#4 <span class="mk-sub" style="display:inline">of 212</span></span></div>
    <div class="ov-kv"><div><span>Record</span><b>23W–9L</b></div><div><span>Win rate</span><b>72%</b></div><div><span>Streak</span><b style="color:var(--cc-green)">W3</b></div></div>
    <div class="ov-wl" role="img" aria-label="23 wins, 9 losses"><i style="width:72%"></i></div>
    <a class="ov-link" href="#">Ranked leaderboard ›</a>
  </section>
  <section class="mk-panel mk-panel--display ov-casual" aria-label="Casual record">
    <h2 class="mk-h2">${icon("smile")}Casual</h2>
    <p class="mk-sub">Open battles · unrated</p>
    <div class="ov-kv"><div><span>Record</span><b>41W–30L</b></div><div><span>Best streak</span><b>W6</b></div></div>
  </section>
  <section class="mk-panel ov-rewards" aria-label="Rewards waiting">
    <h2 class="mk-h2">Rewards waiting</h2>
    <div class="ov-reward" style="margin-top:10px"><img src="${ROOT}/sprites/items/rank_badge.png" alt=""><p>2 achievements to claim<small>1 ranked · 1 collection</small></p><a class="cc-btn cc-btn--gold" href="achievements.html">Claim</a></div>
    <div class="ov-reward"><img src="${ROOT}/sprites/items/starter_pack.png" alt=""><p>Weekly pack ready<small>Resets in 3d 4h</small></p><a class="cc-btn" href="#">Open</a></div>
  </section>
  <section class="mk-panel ov-teams" aria-label="Teams">
    <h3 class="ov-teamhead">${icon("smile")}Display team<a href="teams-a.html">Edit ›</a></h3>${strip("display")}
    <h3 class="ov-teamhead" style="margin-top:14px">${icon("swords")}Battle team <span class="mk-tag mk-tag--lead">Lv 50</span><a href="teams-a.html">Edit ›</a></h3>${strip("battle")}
  </section>
  <section class="mk-panel ov-dex" aria-label="Pokédex completion">
    <h2 class="mk-h2">Pokédex</h2><p class="mk-sub">${regs.reduce((s, r) => s + r[1], 0)} of 649 owned · Megas don’t count as entries</p>
    ${regs.map(([r, n]) => `<div class="ov-reg"><span>${r}</span><span class="bar" role="img" aria-label="${r} ${n} of ${M.regionTotals[r]}"><i style="width:${Math.round((n / M.regionTotals[r]) * 100)}%"></i></span><span>${n}/${M.regionTotals[r]}</span></div>`).join("")}
  </section>
</div>`;
</script>
</body>
</html>
