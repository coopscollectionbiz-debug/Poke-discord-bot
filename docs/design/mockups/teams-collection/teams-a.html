<!doctype html>
<!-- Design mockup (static, synthetic data). Not served by the bot.
     Teams, option A: both teams stacked, box below. Add = pick a box Pokémon, then choose the team.
     States: ?state=edit (default) | add | empty -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Teams · Option A (mockup)</title>
<link rel="stylesheet" href="../../../../public/shared/tokens.css" />
<link rel="stylesheet" href="../../../../public/shared/components.css" />
<link rel="stylesheet" href="mock.css" />
<style>
  .a-teams { display: grid; gap: 16px; }
  .a-teams .mk-slots { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  /* Desktop: the whole card is the drag handle; ◀ ▶ ✕ keep 44 px targets. */
  .a-teams .mk-grip { display: none; }
  .a-teams .mk-slot { padding: 6px; }
  .a-teams .mk-slot-ctl { gap: 2px; }
  .a-box { margin-top: 16px; position: relative; }
  .a-pop { top: 300px; left: 150px; }
  /* Phone: slots become rows so every control keeps a 44 px target. */
  @media (max-width: 820px) {
    .a-teams .mk-slots { grid-template-columns: 1fr; gap: 6px; }
    .a-teams .mk-slot { flex-direction: row; align-items: center; gap: 10px; padding: 6px 8px; }
    .a-teams .mk-stage { flex: none; width: 64px; height: 60px; }
    .a-teams .mk-stage img { max-height: 52px; margin-bottom: 6px; }
    .a-teams .mk-stage::after { bottom: 5px; height: 10px; }
    .a-teams .mk-no { top: 3px; left: 3px; width: 20px; height: 20px; font-size: 11px; }
    .a-teams .mk-shiny { top: 2px; right: 2px; }
    .a-teams .mk-slot-body { flex: 1; padding: 0; }
    .a-teams .mk-slot-tags { min-height: 0; margin-top: 2px; }
    .a-teams .mk-slot-ctl { margin: 0; gap: 2px; }
    .a-teams .mk-slot-ctl .mk-ib { width: 44px; flex: none; }
    .a-teams .mk-slot.is-empty { padding: 0; }
    .a-teams .mk-slot-add { flex-direction: row; min-height: 60px; }
    .a-pop { position: fixed; top: auto; left: 0; right: 0; bottom: 0; width: auto; border-radius: 20px 20px 0 0; padding: 8px 16px 24px; z-index: 990; }
    .a-pop::before { content: ""; display: block; width: 44px; height: 5px; margin: 4px auto 10px; border-radius: 3px; background: var(--cc-line); }
  }
</style>
</head>
<body data-page="teams">
<header class="cc-page-head">
  <p class="cc-eyebrow">Your Pokémon</p>
  <h1>Teams</h1>
  <p>Your Display team shows on /showteam and battles in open battles. Your Battle team fights ranked and wager battles at Lv 50.</p>
</header>
<main id="ccMain" tabindex="-1"></main>
<script src="mock-data.js"></script>
<script src="mock-kit.js"></script>
<script>
const { icon, slotCard, team, rules, ruleError, movedNotice, saveBar, boxFilters, boxList, q } = MK;
MK.shell("teams");
const state = q.get("state") || "edit";
const main = document.getElementById("ccMain");

function panel(key, members, { error = false, empty = false } = {}) {
  const battle = key === "battle";
  const slots = Array.from({ length: 6 }, (_, i) => slotCard(members[i] ?? null, { team: key, index: i, axis: matchMedia("(max-width: 820px)").matches ? "v" : "h" }));
  const head = battle
    ? `<div><h2 class="mk-h2">${icon("swords")}Battle team <span class="mk-tag mk-tag--lead">Ranked</span></h2>
         <p class="mk-sub">Ranked and wager battles. Everyone fights at Lv 50; your Pokémon still earn EXP.</p></div>${rules({ mythic: 1, mega: 1, count: members.filter(Boolean).length, error })}`
    : `<div><h2 class="mk-h2">${icon("smile")}Display team</h2>
         <p class="mk-sub">Open battles at real Levels, plus /showteam and your trainer card.</p></div>`;
  return `<section class="mk-panel mk-panel--${key}" aria-label="${battle ? "Battle" : "Display"} team">
    <div class="mk-panel-head">${head}</div>
    ${empty ? emptyBody(key) : `<ol class="mk-slots">${slots.join("")}</ol>`}
    ${error ? ruleError() : ""}
  </section>`;
}

function emptyBody(key) {
  if (key === "battle")
    return `<div class="cc-empty" style="padding:20px 8px"><p style="margin:0 0 10px"><strong style="color:var(--cc-text)">No Battle team yet.</strong> Ranked and wager battles need one.</p>
      <button type="button" class="cc-btn cc-btn--primary">Copy my Display team</button>
      <p style="margin:10px 0 0;font-size:13px">Or pick Pokémon from your box below. One mythic-tier Pokémon at most.</p></div>`;
  return `<div class="cc-empty" style="padding:20px 8px"><p style="margin:0"><strong style="color:var(--cc-text)">Pick up to six Pokémon from your box.</strong> Slot 1 leads.</p></div>`;
}

let html = "";
if (state === "empty") {
  // New player: one Pokémon caught, no teams.
  html += panel("display", [], { empty: true }) + panel("battle", [], { empty: true });
  html = `<div class="a-teams">${html}</div>`;
  html += `<section class="mk-panel a-box" aria-label="Your box"><div class="mk-panel-head"><div><h2 class="mk-h2">Your box</h2><p class="mk-sub">1 Pokémon</p></div></div>
    <ul class="mk-box">${MK.boxTile({ ...MK.owned(25, "normal"), level: 5 })}</ul>
    <p class="cc-empty" style="padding:16px 0 0">Catch more with /daily and /recruit in Discord.</p></section>`;
} else {
  html += movedNotice();
  html += `<div class="a-teams">${panel("display", team("display"))}${panel("battle", team("battle"), { error: state === "edit" })}</div>`;
  const add = state === "add";
  html += `<section class="mk-panel a-box" aria-label="Your box">
    <div class="mk-panel-head"><div><h2 class="mk-h2">Your box</h2><p class="mk-sub">Tap a Pokémon, then choose a team. D = Display, B = Battle slot.</p></div></div>
    ${boxFilters()}
    <ul class="mk-box">${boxList({ picked: add ? "384:normal" : null })}</ul>
    ${add ? `<div class="mk-pop a-pop" role="dialog" aria-label="Add Rayquaza">
       <h3>Add Rayquaza (Lv 66)</h3><p>Mythic tier · Dragon / Flying</p>
       <button type="button" class="cc-btn">${icon("smile")}Display team<small>Full: replace a slot</small></button>
       <button type="button" class="cc-btn" aria-disabled="true">${icon("lock")}Battle team<small>Mythic limit</small></button>
       <p style="margin:8px 0 0">Your Battle team already has Mewtwo, its one mythic-tier Pokémon.</p>
       <button type="button" class="cc-btn" style="justify-content:center">Cancel</button></div>` : ""}
  </section>`;
  html += saveBar();
}
main.innerHTML = html;
if (state === "add") document.querySelector(".a-box").scrollIntoView();
</script>
</body>
</html>
