<!doctype html>
<!-- Design mockup (static, synthetic data). Not served by the bot.
     Teams, option C: "PC box" split. Box on the left, both teams as a party column on the right.
     Add = pick a Pokémon up, then tap the slot (in either team) to place it. Desktop also drags.
     Phone: both teams as compact 3×2 party grids side by side; tap a slot for its toolbar.
     States: ?state=edit (default) | add | empty -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Teams · Option C (mockup)</title>
<link rel="stylesheet" href="../../../../public/shared/tokens.css" />
<link rel="stylesheet" href="../../../../public/shared/components.css" />
<link rel="stylesheet" href="mock.css" />
<style>
  .c-layout { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 16px; align-items: start; }
  .c-party { display: grid; gap: 12px; position: sticky; top: 16px; }
  .c-party .mk-panel { padding: 12px; }
  .c-party .mk-slots { gap: 6px; }
  .c-party .mk-panel-head { margin-bottom: 8px; }
  .c-boxhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 8px; border-radius: 12px; background: var(--cc-surface-sunken); border: 1.5px solid var(--cc-line); }
  .c-boxhead b { font-size: 16px; }
  .c-box .mk-box { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .c-held { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--cc-blue); background: #4f8cff1f; }
  .c-held img { width: 48px; height: 44px; object-fit: contain; image-rendering: pixelated; }
  .c-held p { flex: 1; margin: 0; color: var(--cc-text); font-weight: 700; font-size: 14px; }
  .c-held p small { display: block; color: var(--cc-text-muted); font-weight: 600; }
  .is-target { outline: 2px dashed var(--cc-blue); outline-offset: 2px; }
  .mk-slot.is-target.is-empty { background: #4f8cff14; border-color: var(--cc-blue); }
  .mk-slot.is-target.is-empty .mk-slot-add { color: var(--cc-blue); }
  .c-blocked { outline: 2px dashed var(--cc-red); outline-offset: 2px; }
  /* Compact party grids (phone) */
  .c-mini-wrap { display: none; }
  .c-mini { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .c-mini button { position: relative; width: 100%; aspect-ratio: 1; min-height: 46px; padding: 0; display: grid; place-items: center; border-radius: 10px; border: 1.5px solid var(--cc-line); background: var(--cc-surface-sunken); }
  .c-mini button img { width: 90%; height: 80%; object-fit: contain; image-rendering: pixelated; }
  .c-mini .n { position: absolute; top: 2px; left: 4px; font-size: 10px; font-weight: 800; color: var(--cc-text-faint); }
  .c-mini .lead { border-color: #4f8cffaa; }
  .c-mini .lead .n { color: var(--cc-blue); }
  .c-mini .shiny { border-color: #f5c84caa; }
  .c-mini .mega { box-shadow: inset 0 -3px 0 var(--cc-mega); }
  .c-mini .changed { border-style: dashed; border-color: var(--cc-blue); }
  .c-mini [aria-pressed="true"] { border-color: var(--cc-blue); box-shadow: var(--cc-ring-blue); }
  .c-mini .add { color: var(--cc-text-faint); border-style: dashed; }
  .c-tool { display: flex; align-items: center; gap: 6px; margin-top: 10px; padding: 8px; border-radius: 12px; background: var(--cc-surface-raised); border: 1.5px solid var(--cc-blue); }
  .c-tool img { width: 44px; height: 40px; object-fit: contain; image-rendering: pixelated; }
  .c-tool p { flex: 1; margin: 0; min-width: 0; color: var(--cc-text); font-weight: 800; font-size: 13.5px; }
  .c-tool p small { display: block; color: var(--cc-text-muted); font-weight: 600; font-size: 12px; }
  @media (max-width: 1100px) { .c-layout { grid-template-columns: minmax(0, 1fr) 360px; } }
  @media (max-width: 820px) {
    .c-layout { grid-template-columns: 1fr; }
    .c-party { display: none; }
    .c-mini-wrap { display: block; position: sticky; top: 0; z-index: 30; margin: 0 -16px 12px; padding: 10px 16px; background: var(--cc-chrome); border-bottom: 1px solid var(--cc-line); }
    .c-mini-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .c-mini-cols h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 13px; font-weight: 800; }
    .c-mini-cols h2 .mk-ic { width: 16px; height: 16px; }
    .c-mini-cols h2 small { margin-left: auto; font-size: 11px; color: var(--cc-text-faint); }
    .c-box .mk-box { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .c-boxhead .cc-btn { padding: 0 10px; }
  }
</style>
</head>
<body data-page="teams">
<header class="cc-page-head">
  <p class="cc-eyebrow">Your Pokémon</p>
  <h1>Teams</h1>
  <p>Pick a Pokémon up from your box, then place it in either team.</p>
</header>
<main id="ccMain" tabindex="-1"></main>
<script src="mock-data.js"></script>
<script src="mock-kit.js"></script>
<script>
const { icon, slotCard, team, rules, ruleError, movedNotice, saveBar, boxList, sprite, owned, q } = MK;
MK.shell("teams");
const state = q.get("state") || "edit";
const add = state === "add", empty = state === "empty";
const main = document.getElementById("ccMain");

const display = empty ? [] : team("display");
let battle = empty ? [] : team("battle");
if (add) MK.TEAMS.battle = [...MK.TEAMS.battle.slice(0, 5), null];
if (add) battle = [...battle.slice(0, 5).map((p) => p && { ...p, change: p.id === 94 ? "Moved" : null }), null]; // Garchomp not placed yet

function rowsPanel(key, members) {
  const isB = key === "battle";
  const rows = Array.from({ length: 6 }, (_, i) => slotCard(members[i] ?? null, { team: key, index: i, size: "row" }));
  let out = `<section class="mk-panel mk-panel--${key}" aria-label="${isB ? "Battle" : "Display"} team">
    <div class="mk-panel-head"><div><h2 class="mk-h2">${icon(isB ? "swords" : "smile")}${isB ? "Battle team" : "Display team"}</h2>
    <p class="mk-sub">${isB ? "Ranked and wagers · Lv 50" : "Open battles · real Levels · /showteam"}</p></div>
    ${isB ? rules({ mythic: empty ? 0 : 1, mega: empty ? 0 : 1, count: members.filter(Boolean).length, error: state === "edit" }) : ""}</div>
    <ol class="mk-slots">${rows.join("")}</ol>${isB && state === "edit" ? ruleError() : ""}</section>`;
  if (add) {
    // Drop targets while holding Garchomp: every slot of both teams.
    out = out.replace(/class="mk-slot mk-slot--row/g, 'class="mk-slot mk-slot--row is-target');
  }
  return out;
}

function mini(key, members, selected = -1) {
  const isB = key === "battle";
  const cells = Array.from({ length: 6 }, (_, i) => {
    const p = members[i];
    if (!p) return `<li><button type="button" class="add" aria-label="Add to ${isB ? "Battle" : "Display"} slot ${i + 1}">${icon("plus")}</button></li>`;
    const cls = [i === 0 && "lead", p.variant === "shiny" && "shiny", p.mega && "mega", p.change && "changed"].filter(Boolean).join(" ");
    return `<li><button type="button" class="${cls}" aria-pressed="${i === selected}" aria-label="Slot ${i + 1}: ${p.mega ? p.mega.name : p.name}, Lv ${isB ? 50 : p.level}">
      <span class="n">${i + 1}</span><img src="${sprite(p.id, p.variant, p.mega?.id)}" alt=""></button></li>`;
  });
  return `<div><h2>${icon(isB ? "swords" : "smile")}${isB ? "Battle" : "Display"}<small>${isB ? "Lv 50" : `${members.filter(Boolean).length}/6`}</small></h2><ul class="c-mini">${cells.join("")}</ul></div>`;
}

let html = empty ? "" : movedNotice();
const sel = state === "edit" ? 1 : -1;
const g = owned(94, "normal");
html += `<div class="c-mini-wrap">
  <div class="c-mini-cols">${mini("display", display)}${mini("battle", battle, sel)}</div>
  ${sel === 1 ? `<div class="c-tool" role="toolbar" aria-label="Gengar in Battle slot 2">
      <img src="${sprite(94)}" alt=""><p>Gengar <small>Battle slot 2 · Lv 50 (yours Lv 41)</small></p>
      <button type="button" class="mk-ib" aria-label="Move Gengar left">${icon("left")}</button>
      <button type="button" class="mk-ib" aria-label="Move Gengar right">${icon("right")}</button>
      <button type="button" class="mk-ib mk-ib--x" aria-label="Remove Gengar">${icon("x")}</button></div>` : ""}
  ${state === "edit" ? `<div class="mk-error" role="alert" style="margin-top:10px">${icon("lock")}<p><strong>Mythic limit</strong>Rayquaza can’t join: Mewtwo is already your Battle team’s mythic-tier Pokémon.</p></div>` : ""}
</div>`;

const held = add ? owned(445, "normal") : null;
html += `<div class="c-layout">
  <section class="mk-panel c-box" aria-label="Your box">
    <div class="c-boxhead"><button type="button" class="mk-ib" aria-label="Previous box">${icon("left")}</button><b>All Pokémon · ${MK.M.box.length}</b><button type="button" class="mk-ib" aria-label="Next box">${icon("right")}</button></div>
    ${held ? `<div class="c-held" role="status">${'<img src="' + sprite(445) + '" alt="">'}<p>Holding Garchomp (Lv 57)<small>Tap a slot in either team to place it. Esc or Cancel to put it back.</small></p><button type="button" class="cc-btn">Cancel</button></div>` : ""}
    ${MK.boxFilters()}
    <ul class="mk-box">${empty ? MK.boxTile({ ...owned(25, "normal"), level: 5 }) : boxList({ held: add ? "445:normal" : null, limit: 36 })}</ul>
    ${empty ? `<p class="cc-empty">Tap Pikachu, then a slot, to start your teams.</p>` : ""}
  </section>
  <div class="c-party">${rowsPanel("display", display)}${rowsPanel("battle", battle)}</div>
</div>`;
if (!empty) html += saveBar(add ? "Battle team: Gengar moved to slot 2" : undefined);
main.innerHTML = html;
</script>
</body>
</html>
