app = 'poke-discord-bot-49shta'
primary_region = 'iad'

# Graceful shutdown (bot_final.js gracefulShutdown) flushes the local save
# (≤8s), uploads the final Discord backup (≤8s), then destroys the client
# (≤2s), with a 25s hard exit. Fly's default kill timeout (5s) can SIGKILL
# the process before the final backup finishes, so allow 30s.
kill_timeout = 30

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  # A2: player data lives on the persistent volume below. A Fly volume
  # attaches to ONE machine, so the app has a single local writer;
  # LOCAL_IS_DURABLE lets it boot from its own verified snapshot when
  # Discord is unreachable (persistence/loader.js).
  TRAINERDATA_DIR = '/data'
  LOCAL_IS_DURABLE = '1'
  # /challenge works only in this channel; unset, it works anywhere. Set it
  # to the challenge channel's ID when feat/challenges merges.
  # CHALLENGE_CHANNEL_ID = ''

# A2: persistent volume for trainerData snapshots and the event log.
# Create it BEFORE deploying this config (see RUNBOOK "A2 volume migration").
[mounts]
  source = 'trainerdata'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
