<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Achievements · Coop's Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/shared/tokens.css" />
  <link rel="stylesheet" href="/public/shared/components.css" />
  <link rel="stylesheet" href="/public/dashboardshop/style.css" />
  <link rel="stylesheet" href="/public/bag/style.css" />
  <link rel="stylesheet" href="/public/achievements/style.css" />
</head>
<body data-page="achievements">
  <header class="cc-page-head">
    <p class="cc-eyebrow">Milestones</p>
    <h1>Achievements</h1>
    <p>Milestones you've reached and what's next.</p>
  </header>

  <main id="ccMain" tabindex="-1">
    <section class="shop-section" aria-label="Achievements">
      <div id="achSummary" class="ach-summary"></div>
      <div id="achGroups" class="ach-groups" role="group" aria-label="Achievement group">
        <button type="button" data-group="all" aria-pressed="true">All</button>
        <button type="button" data-group="ranked" aria-pressed="false">⚔️ Ranked</button>
        <button type="button" data-group="casual" aria-pressed="false">🎮 Casual</button>
        <button type="button" data-group="other" aria-pressed="false">📚 Collection &amp; more</button>
      </div>
      <div class="bag-controls">
        <label>Category <select id="achCategory"><option value="">All categories</option></select></label>
        <label>Show
          <select id="achFilter">
            <option value="all">All</option>
            <option value="unlocked">Unlocked</option>
            <option value="locked">Locked</option>
            <option value="claimable">Rewards ready</option>
          </select>
        </label>
      </div>
      <p id="achStatus" class="subtitle" aria-live="polite">Loading…</p>
      <div id="achGrid" class="shop-grid"></div>
    </section>
  </main>

  <script type="module" src="/public/shared/shell.js"></script>
  <script type="module" src="/public/achievements/script.js"></script>
</body>
</html>
