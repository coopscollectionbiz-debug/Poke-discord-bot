<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Coop's Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/shared/tokens.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Admin sections">
      <div class="nav-brand">
        <span class="nav-title">Coop's Collection</span>
        <span class="nav-sub">Admin</span>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="#/overview" data-section="overview">Overview</a>
        <a class="nav-link" href="#/players" data-section="players">Players</a>
        <a class="nav-link" href="#/grants" data-section="grants">Grants</a>
        <a class="nav-link" href="#/changes" data-section="changes">Admin changes</a>
        <a class="nav-link" href="#/live" data-section="live">Live events</a>
        <a class="nav-link" href="#/events" data-section="events">Activity log</a>
      </div>
      <div class="nav-session" id="sessionInfo"></div>
    </nav>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <!-- Review panel: every change passes through here before it saves. -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <header class="sheet-head">
      <h2 id="sheetTitle">Review change</h2>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="Close">×</button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="session-overlay" id="sessionOverlay" hidden>
    <div class="session-card">
      <h2>Session expired</h2>
      <p>Run <code>/admindashboard</code> in Discord for a new link. The request that failed changed nothing.</p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="script.js"></script>
</body>
</html>
