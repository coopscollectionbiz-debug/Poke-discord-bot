<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bag · Coop’s Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/shared/tokens.css" />
  <link rel="stylesheet" href="/public/shared/components.css" />
  <link rel="stylesheet" href="/public/dashboardshop/style.css" />
  <link rel="stylesheet" href="/public/bag/style.css" />
</head>
<body data-page="bag">
  <header class="cc-page-head">
    <p class="cc-eyebrow">Inventory</p>
    <h1>Bag</h1>
    <p>Everything you own, and what it’s for.</p>
  </header>

  <main id="ccMain" tabindex="-1">
    <section class="shop-section" aria-label="Items">
      <div class="bag-controls">
        <label>Category
          <select id="bagCategory"><option value="">All items</option></select>
        </label>
        <label>Sort
          <select id="bagSort">
            <option value="default">Category, then rarity</option>
            <option value="name">Name</option>
            <option value="quantity">Quantity</option>
          </select>
        </label>
        <label class="bag-search"><span class="sr-only">Search items</span>
          <input id="bagSearch" type="search" placeholder="Search items…" />
        </label>
      </div>
      <p id="bagStatus" class="subtitle" aria-live="polite">Loading…</p>
      <div id="bagGrid" class="shop-grid"></div>
    </section>
  </main>

  <script type="module" src="/public/shared/shell.js"></script>
  <script type="module" src="/public/bag/script.js"></script>
</body>
</html>
