<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pokémon · Coop’s Collection</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/public/shared/tokens.css" />
    <link rel="stylesheet" href="/public/shared/components.css" />
    <link rel="stylesheet" href="/public/picker-pokemon/style.css" />
  </head>

  <body data-page="pokemon">
    <header class="cc-page-head">
      <p class="cc-eyebrow">Your collection</p>
      <h1>Pokémon</h1>
      <p>Build your Team, evolve with stones, donate for CC and convert to shiny.</p>
    </header>

    <main id="ccMain" tabindex="-1">
      <!-- Player stats (sticky) -->
      <div id="statsBar" aria-label="Your resources">
        <div class="stat-item">
          <img src="/public/sprites/items/evolution_stone.png" class="stat-icon" alt="" />
          <span id="stoneCount">0</span> <span class="stat-label">Stones</span>
        </div>
        <div class="stat-item">
          <img src="/public/sprites/items/cc_coin.png" class="stat-icon" alt="" />
          <span id="ccCount">0</span> <span class="stat-label">CC</span>
        </div>
        <div class="stat-item">
          <img src="/public/sprites/items/tp_icon.png" class="stat-icon" alt="" />
          <span id="tpCount">0</span> <span class="stat-label">TP</span>
        </div>
        <div class="stat-item stat-gold">
          <img src="/public/sprites/items/shiny_dust.png" class="stat-icon" alt="" />
          <span id="dustCount">0</span> <span class="stat-label">Dust</span>
        </div>
        <div class="stat-item">
          <img src="/public/sprites/items/rank_badge.png" class="stat-icon" alt="" />
          <span class="sr-only">Rank:</span> <span id="rankLabel">Novice Trainer</span>
        </div>
      </div>

      <div id="pokemonPanel">
        <div id="modeToggle" role="group" aria-label="Mode">
          <button class="mode-btn active" data-mode="team" type="button">Change Team</button>
          <button class="mode-btn" data-mode="evolve" type="button">Evolve</button>
          <button class="mode-btn" data-mode="donate" type="button">Donate</button>
          <button class="mode-btn" data-mode="convert" type="button">Convert</button>
        </div>

        <p id="dustStatus" class="timer-status" style="display:none;"></p>

        <!-- Bulk donate (Donate mode only; JS shows/hides) -->
        <div id="bulkDonateRow" style="display:none;">
          <button id="donateDuplicatesBtn" class="mode-btn" type="button">Donate Duplicates (0)</button>
          <button id="multiSelectToggle" class="mode-btn" type="button" aria-pressed="false">Multi-select</button>
        </div>

        <div id="controls">
          <label class="sr-only" for="search">Search Pokémon</label>
          <input type="search" id="search" placeholder="Search Pokémon…" autocomplete="off" />

          <label class="sr-only" for="rarityFilter">Rarity</label>
          <select id="rarityFilter">
            <option value="">All Rarities</option>
            <option value="common">Common</option>
            <option value="uncommon">Uncommon</option>
            <option value="rare">Rare</option>
            <option value="epic">Epic</option>
            <option value="legendary">Legendary</option>
            <option value="mythic">Mythic</option>
          </select>

          <label class="sr-only" for="typeFilter">Type</label>
          <select id="typeFilter">
            <option value="">All Types</option>
            <option value="fire">Fire</option>
            <option value="water">Water</option>
            <option value="grass">Grass</option>
            <option value="electric">Electric</option>
            <option value="psychic">Psychic</option>
            <option value="fighting">Fighting</option>
            <option value="dark">Dark</option>
            <option value="fairy">Fairy</option>
            <option value="steel">Steel</option>
            <option value="ghost">Ghost</option>
            <option value="rock">Rock</option>
            <option value="ground">Ground</option>
            <option value="poison">Poison</option>
            <option value="ice">Ice</option>
            <option value="dragon">Dragon</option>
            <option value="bug">Bug</option>
            <option value="flying">Flying</option>
            <option value="normal">Normal</option>
          </select>

          <label class="sr-only" for="sortOrder">Sort</label>
          <select id="sortOrder">
            <option value="dex">Sort: Pokédex #</option>
            <option value="power-desc">Sort: Power (high → low)</option>
            <option value="power-asc">Sort: Power (low → high)</option>
            <option value="level-desc">Sort: Level (high → low)</option>
            <option value="level-asc">Sort: Level (low → high)</option>
            <option value="name">Sort: Name (A → Z)</option>
          </select>

          <!-- Owned / unowned filter (Change Team mode). IDs must match JS. -->
          <div class="toggle-group" role="group" aria-label="Show">
            <button id="ownedToggle" class="mode-btn" type="button">Owned</button>
            <button id="unownedToggle" class="mode-btn" type="button">Unowned</button>
          </div>
        </div>

        <div id="pokemonGrid">
          <p class="cc-empty">Loading your Pokémon…</p>
        </div>

        <footer class="team-footer">
          <p id="teamCounter" aria-live="polite">0/6 selected</p>
          <button id="saveTeamBtn" class="save-btn" type="button">Save Team</button>
          <p id="teamStatus" class="status-msg"></p>
          <p class="fine-print">Opened from /dashboard in Discord · Links last 10 minutes</p>
        </footer>

        <!-- Multi-select action bar (pinned to the bottom while Multi-select is on) -->
        <div id="multiSelectBar" style="display:none;" role="region" aria-label="Multi-select donation">
          <span id="multiSelectSummary" aria-live="polite">0 selected</span>
          <button id="multiSelectClear" type="button">Clear</button>
          <button id="multiSelectDonate" type="button" disabled>Donate</button>
        </div>
      </div>
    </main>

    <script type="module" src="/public/shared/shell.js"></script>
    <script type="module" src="/public/picker-pokemon/script.js"></script>
  </body>
</html>
