<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trainers · Coop’s Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/public/shared/tokens.css" />
    <link rel="stylesheet" href="/public/shared/components.css" />
    <link rel="stylesheet" href="/public/picker/style.css" />
  </head>

  <body data-page="trainers">
    <header class="cc-page-head">
      <p class="cc-eyebrow">Your profile</p>
      <h1>Trainers</h1>
      <p>Choose the Trainer shown on your profile. Only owned Trainers can be equipped.</p>
    </header>

    <main id="ccMain" tabindex="-1">
      <!-- Sticky CC bar -->
      <div id="ccBar" aria-label="Your CC">
        <img src="/public/sprites/items/cc_coin.png" alt="" />
        <span id="ccDisplay">…</span>
      </div>

      <section class="controls" aria-label="Filters">
        <label class="sr-only" for="search">Search Trainers</label>
        <input type="search" id="search" placeholder="Search Trainers…" autocomplete="off" />

        <label class="sr-only" for="rarityFilter">Rarity</label>
        <select id="rarityFilter">
          <option value="all">All Rarities</option>
          <option value="common">Common</option>
          <option value="uncommon">Uncommon</option>
          <option value="rare">Rare</option>
          <option value="epic">Epic</option>
          <option value="legendary">Legendary</option>
          <option value="mythic">Mythic</option>
        </select>

        <div class="toggle-group" role="group" aria-label="Show">
          <button id="ownedToggle" class="toggle-btn" type="button" aria-pressed="false">Owned</button>
          <button id="unownedToggle" class="toggle-btn" type="button" aria-pressed="false">Not owned</button>
        </div>
      </section>

      <div id="trainerGrid" class="grid">
        <p class="notice cc-empty">Loading Trainers…</p>
      </div>

      <p class="fine-print">Opened from /dashboard in Discord · Links last 10 minutes</p>
    </main>

    <!-- Processing overlay (shown while a request is in flight) -->
    <div id="processingOverlay" role="status" aria-live="polite">
      <div id="processingBox">Processing…</div>
    </div>
    <script>
      window.showProcessing = () => {
        const el = document.getElementById("processingOverlay");
        if (el) el.style.display = "flex";
      };
      window.hideProcessing = () => {
        const el = document.getElementById("processingOverlay");
        if (el) el.style.display = "none";
      };
    </script>

    <script type="module" src="/public/shared/shell.js"></script>
    <script type="module" src="/public/picker/script.js"></script>
  </body>
</html>
